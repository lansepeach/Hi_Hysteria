name: Regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned yq
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/hihy-tools"
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 120 \
            https://github.com/mikefarah/yq/releases/download/v4.53.6/yq_linux_amd64 \
            -o "$RUNNER_TEMP/hihy-tools/yq"
          echo "c5f056448f973ae7d39b5401949648a78f2dc1947d6a8eb65be60d5c504b9385  $RUNNER_TEMP/hihy-tools/yq" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/hihy-tools/yq"
          echo "$RUNNER_TEMP/hihy-tools" >> "$GITHUB_PATH"
      - name: Check syntax and version consistency
        shell: bash
        run: |
          for script in server/*.sh tests/*.sh; do
            bash -n "$script"
          done
          source server/hy2.sh
          test "$hihyV" = "$(cat VERSION)"
      - name: Run isolated regression tests
        run: |
          bash tests/hy2_regression.sh
          bash tests/reliability_regression.sh
          bash tests/management_regression.sh
          bash tests/safety_regression.sh
      - name: Test firewall backends in isolated namespaces
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables iptables iproute2
          sudo env "PATH=$PATH" bash tests/nft_integration.sh
          sudo env "PATH=$PATH" bash tests/iptables_integration.sh
      - name: Download verified Hysteria core
        shell: bash
        run: |
          release=https://github.com/HyNetworks/hysteria/releases/download/app/v2.12.3
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 120 "$release/hysteria-linux-amd64" -o "$RUNNER_TEMP/hysteria"
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 30 "$release/hashes.txt" -o "$RUNNER_TEMP/hysteria-hashes.txt"
          awk -v file="$RUNNER_TEMP/hysteria" '$2 == "build/hysteria-linux-amd64" {print $1 "  " file}' "$RUNNER_TEMP/hysteria-hashes.txt" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/hysteria"
      - name: Test ECH with real core on loopback
        run: python3 tests/ech_integration.py "$RUNNER_TEMP/hysteria"
      - name: Test generated configurations and certificate migration on loopback
        run: python3 tests/config_integration.py "$RUNNER_TEMP/hysteria"
      - name: Test real-time monitor and IP authentication on loopback
        run: python3 tests/monitor_integration.py "$RUNNER_TEMP/hysteria"
